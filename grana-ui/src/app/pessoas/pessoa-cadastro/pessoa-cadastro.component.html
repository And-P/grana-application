<div class="container">

    <form  #pessoaForm="ngForm" (ngSubmit)="salvar(pessoaForm)" autocomplete="off">
        
        <div class="p-grid">

            <div class="p-col-12">
              <h1>{{ editando ? 'Edição de' : 'Cadastro de' }} Pessoa</h1>
            </div>

            <div class="formgrid grid">

                <div class="lg:col-12 md:col-12 sm:col-12 p-fluid">
                  <label>Nome</label>
                  <input pInputText 
                         name="nome" 
                         type="text"
                         [(ngModel)]="pessoa.nome"
                         #nome="ngModel"
                         [required]="true"
                         minlength="2"
                         >

                         <app-message
                            [control]="nome"
                            error="required"
                            text="Nome é obrigatório." 
                          ></app-message>
                          
                          <app-message 
                            [control]="nome" 
                            error="minlength"
                            text="Mínimo de {{ nome.errors?.['minlength']?.requiredLength }} caracteres">
                          </app-message>
                </div>

                <div class="lg:col-8 md:col-8 sm:col-12 p-fluid">
                  <label>Logradouro</label>
                  <input pInputText
                         name="logradouro"
                         type="text"
                         [(ngModel)]="pessoa.endereco.logradouro"
                         #logradouro="ngModel"
                         [required]="true"
                         >

                         <app-message
                            [control]="logradouro"
                            error="required"
                            text="Logradouro é obrigatório." 
                          ></app-message>
                </div>

                <div class="lg:col-4 md:col-4 sm:col-12 p-fluid">
                  <label>Numero</label>
                  <input pInputText
                         name="numero"
                         type="text"
                         [(ngModel)]="pessoa.endereco.numero"
                         #numero="ngModel"
                         [required]="true"
                         >


                  <app-message
                      [control]="numero"
                      error="required"
                      text="Número é obrigatório." 
                    ></app-message>

                </div>

                <div class="lg:col-4 md:col-4 sm:col-12 p-fluid">
                  <label>Complemento</label>
                  <input pInputText
                         name="complemento"
                         type="text"
                         [(ngModel)]="pessoa.endereco.complemento"
                         >
                </div>

                <div class="lg:col-4 md:col-4 sm:col-12 p-fluid">
                  <label>Bairro</label>
                  <input pInputText
                         type="text"
                         name="bairro"
                         [(ngModel)]="pessoa.endereco.bairro"
                         #bairro="ngModel"
                         [required]="true" 
                         >

                  <app-message
                      [control]="bairro"
                      error="required"
                      text="Bairro é obrigatório." 
                    ></app-message>

                  
                </div>

                <div class="lg:col-4 md:col-4 sm:col-12 p-fluid">
                  <label>CEP</label>
                  <input pInputText
                      type="text"
                      name="cep"
                      mask="99.999-999"
                      [(ngModel)]="pessoa.endereco.cep"
                      #cep="ngModel"
                      [required]="true"
                  >

                  <app-message
                      [control]="cep"
                      error="required"
                      text="CEP é obrigatório." 
                  ></app-message>

                </div>

                <div class="lg:col-8 md:col-8 sm:col-12 p-fluid">
                  <label>Cidade</label>
                  <input pInputText
                         type="text"
                         name="cidade"
                         [(ngModel)]="pessoa.endereco.cidade"
                         #cidade="ngModel"
                         [required]="true" 
                         >

                  <app-message
                      [control]="cidade"
                      error=""
                      text="Cidade é obrigatória." 
                      >
                  </app-message>
                </div>

                <div class="lg:col-4 md:col-4 sm:col-12 p-fluid">
                  <label>Estado</label>
                  <input pInputText 
                         type="text"
                         name="estado"
                         [(ngModel)]="pessoa.endereco.estado"
                         #estado="ngModel"
                         [required]="true" 
                         >

                  <app-message
                      [control]="estado"
                      error="required"
                      text="Estado é obrigatório." 
                    >
                  </app-message>
                </div>

                
            </div>    

            <div class="col-12">
              <p-panel header="Contatos">
              <div class="grid">
                  <div class="col-12">
                      <button pButton 
                              label="Criar Contato" 
                              icon="pi pi-plus" 
                              type="button" 
                              class="p-button-raised p-button-text"
                              (click)="dialogFormNovoContato()">
                      </button>
                  </div>
                  <div class="col-12">
                    <p-table [value]="pessoa.contatos" [responsive]="true">
                      <ng-template pTemplate="header">
                        <tr>
                          <th>Nome</th>
                          <th>E-mail</th>
                          <th>Telefone</th>
                        <th class="col-acoes-header"></th>
                        </tr>
                      </ng-template>

                      <ng-template pTemplate="body" let-contato>
                        <tr>
                          <td>{{ contato.nome }}</td>
                          <td>{{ contato.email }}</td>
                          <td>{{ contato.telefone }}</td>
                          <td class="col-acoes">
                            <button pButton 
                                    icon="pi pi-pencil" 
                                    type="button" 
                                    class="p-button-secondary" 
                                    pTooltip="Editar" 
                                    tooltipPosition="top" size="small">
                            </button>
                            <button pButton 
                                    icon="pi pi-trash" 
                                    type="button" 
                                    class="p-button-danger"
                                    pTooltip="Excluir"
                                    tooltipPosition="top">
                            </button>
                          </td>
                        </tr>
                      </ng-template>

                      <ng-template pTemplate="emptymessage">
                        <tr>
                          <td colspan="4">
                            Nenhum contato cadastrado
                          </td>
                        </tr>
                      </ng-template>
                    </p-table>
                  </div>
                </div>
              </p-panel>
            </div>

            <div class="formgrid grid">
              <div class="lg:col-2 md:col-2 sm:col-3 p-fluid">
                <button pButton 
                        icon="pi pi-check" 
                        class="p-button-help" 
                        type="submit" 
                        label="Salvar"
                        [disabled]="pessoaForm.invalid"></button>
              </div>
              <div class="lg:col-2 md:col-2 sm:col-3 p-fluid">
                <button pButton 
                        icon="pi pi-plus" 
                        class="p-button-secondary" 
                        type="button" 
                        label="Novo"
                        (click)="nova(pessoaForm)"></button>
              </div>
              <div class="lg:col-4 md:col-4 sm:col-6 p-fluid">  
                <a [routerLink]="['/pessoas']" class="p-button p-button-text">Voltar para a pesquisa</a>
              </div>
            </div>  

        </div>

    </form>

</div>   

<p-dialog header="Novo Contato" 
          *ngIf= "contato"
          [(visible)]="exbindoFormularioContato" 
          [modal]="true"
          [style]="{width: '70vw'}">

    <form #frmContato="ngForm" (ngSubmit)="confirmarContato(frmContato)">
        
        <div class="col-12 p-fluid">
          <label>Nome</label>
          <input pInputText 
                 type="text" 
                 name="nome" 
                 required 
                 [(ngModel)]="contato.nome" 
                 #contatoNome="ngModel" />
        
          <app-message [control]="contatoNome.control" 
                       error="required" 
                       text="Informe o nome">
          </app-message>
        </div>
      
        <div class="col-12 p-fluid">
          <label>E-mail</label>
          <input pInputText 
                 type="email" 
                 name="email" 
                 required email 
                 [(ngModel)]="contato.email" 
                 #contatoEmail="ngModel" />
        
          <app-message [control]="contatoEmail.control" 
                       error="required" 
                       text="Informe o email">
          </app-message>
          <app-message [control]="contatoEmail.control" 
                       error="email" 
                       text="Informe um e-mail válido">
          </app-message>
        </div>
      
        <div class="col-12 p-fluid">
          <label>Telefone</label>
          <p-inputMask name="telefone" 
                       mask="(99) 99999-999?9"
                       [(ngModel)]="contato.telefone"
                       #contatoTelefone="ngModel">
          </p-inputMask>

          <app-message [control]="contatoTelefone.control" 
                       error="required" 
                       text="Informe o telefone">
          </app-message>
        </div>
      
        <div class="col-12">
          <button pButton 
                  type="submit" 
                  label="Confirmar" 
                  [disabled]="frmContato.invalid">
          </button>
        </div>
    
    </form>
</p-dialog>
