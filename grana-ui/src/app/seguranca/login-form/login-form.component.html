<div class="container" style="max-width: 400px; margin: auto;">

    <form autocomplete="off" #loginForm="ngForm">
        <div class="grid" style="margin-top: 75px;border:1px solid #282828; border-radius: 10px;">
            
            <div class="col-12 p-fluid" >
                <img src="../../../assets/umbrella_carimbo.jpg" width="100%" alt="Grana Application" style="border-radius: 2%;"/>
                <!-- <h1>Login</h1> -->
            </div>

            <div class="col-12 p-fluid">
                <input pInputText 
                       type="email" 
                       name="usuario" 
                       placeholder="E-mail" 
                       ngModel 
                       required 
                       #usuario
                       >
            </div>

            <div class="col-12 p-fluid">
                <input pInputText 
                       type="password" 
                       name="senha" 
                       placeholder="Senha" 
                       ngModel 
                       required 
                       #senha
                       >
            </div>

            <div class="col-12 p-fluid">
                <button pButton 
                        type="submit" 
                        label="Login" 
                        [disabled]="loginForm.invalid"
                        (click)="login(usuario.value, senha.value); senha.value = ''"
                        >
                </button>
            </div>

        </div>
    </form>

</div>
